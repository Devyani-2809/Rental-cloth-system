<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Return Product | RentStyle</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        .return-container { max-width: 680px; margin: 40px auto; padding: 20px; }
        .bill-card { background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; margin-bottom: 20px; }
        .bill-card-header { background: #7c3aed; color: #fff; padding: 20px 24px; }
        .bill-card-header h2 { margin: 0; font-size: 1.3em; }
        .bill-card-header p { margin: 4px 0 0; font-size: 0.9em; opacity: 0.8; }
        .bill-body { padding: 20px 24px; }
        .bill-row { display: flex; justify-content: space-between; padding: 7px 0; color: #333; font-size: 0.95em; border-bottom: 1px solid #f0f0f0; }
        .bill-row:last-child { border-bottom: none; }
        .bill-row.total { font-weight: 800; font-size: 1.15em; color: #000; padding-top: 12px; }
        .bill-row.credit { color: #16a34a; font-weight: 600; }
        .bill-row.due { color: #dc3545; font-weight: 700; }
        .pay-method-box { border: 2px solid #e5e7eb; border-radius: 12px; padding: 18px; cursor: pointer; text-align: center; transition: border-color 0.2s; }
        .pay-method-box:hover { border-color: #7c3aed; background: #faf5ff; }
        .pay-method-box h3 { margin: 8px 0 4px; color: #000; font-size: 0.95em; }
        .pay-method-box p { margin: 0; color: #666; font-size: 0.82em; }
        .upi-box { background: #f0fdf4; border: 2px solid #22c55e; border-radius: 14px; padding: 20px; text-align: center; margin: 16px 0; }
        .upi-number { font-size: 1.8em; font-weight: 800; color: #111; letter-spacing: 2px; margin: 8px 0 4px; }
        .upi-name { font-size: 1em; color: #16a34a; font-weight: 600; }
        .input-field { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1em; box-sizing: border-box; margin-top: 6px; }
    </style>
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <a class="brand" href="index.html">RentStyle</a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="orders.html">My Orders</a>
            </nav>
            <div class="actions"></div>
        </header>

        <div class="return-container">
            <h1 style="color:#000; margin-bottom:6px;">Return Product</h1>
            <p style="color:#666; margin-bottom:24px;">Review your return bill and complete payment to submit return request.</p>
            <div id="returnBillContainer"><p style="color:#666;">Loading...</p></div>
        </div>

        <footer class="site-footer">
            <p>&copy; 2026 RentStyle. All rights reserved.</p>
        </footer>
    </div>

    <div id="modalOverlay" class="modal-overlay hidden"></div>
    <div id="modal" class="modal hidden">
        <button id="closeModal" class="close-btn">×</button>
        <div id="modalContent"></div>
    </div>

    <script src="supabase.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
